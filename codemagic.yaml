workflows:
  vovozinha-apk:
    name: Vovozinha APK Profile
    max_build_duration: 60

    environment:
      node: 18.17.0
      java: 17
      vars:
        LANG: "en_US.UTF-8"
        LC_ALL: "en_US.UTF-8"
        ANDROID_SDK_ROOT: "/usr/local/share/android-sdk"
        GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Instalar dependências Node
        script: |
          npm install

      - name: Criar local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Baixar gradlew e wrapper jar
        script: |
          cd android
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew" \
            -o gradlew
          chmod +x gradlew

      - name: Criar debug.keystore
        script: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            -Dorg.gradle.java.home=$JAVA_HOME

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - loggergray@gmail.com
        notify:
          success: true
          failure: true
